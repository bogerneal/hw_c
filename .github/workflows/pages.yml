name: Deploy Power Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'power_forecast_site/dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate website JavaScript
        run: |
          node --check power_forecast_site/dist/app.js
          node --check power_forecast_site/dist/data.js
          test -f power_forecast_site/dist/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: power_forecast_site/dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
